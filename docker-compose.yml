# Dev ports are random (probed free on 2026-08-21).
# /deploy will rewrite host ports to 8081+.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_USER: gojira
      POSTGRES_PASSWORD: gojira
      POSTGRES_DB: gojira
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "18234:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gojira -d gojira"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      TZ: Asia/Shanghai
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "18233:8025"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://gojira:gojira@postgres:5432/gojira?sslmode=disable
      JWT_SECRET: gojira-dev-secret-change-in-prod-32b
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: gojira@local.dev
      SMTP_TLS: "false"
      LOG_LEVEL: info
      WORKFLOW_PATH: /app/config/workflow.yaml
    volumes:
      - ./config:/app/config:ro
    ports:
      - "18232:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
    ports:
      - "18231:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
